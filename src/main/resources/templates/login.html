<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('Sign in')}"></head>
<body class="login">
<main class="panel login-panel">
    <span class="brand">Catalog</span>
    <h1>Sign in</h1>
    <p class="muted">Use your LDAP account to access the catalog.</p>
    <p class="alert error" role="alert" th:if="${param.error}">Sign-in failed. Check your username and password.</p>
    <p class="alert" role="status" th:if="${param.logout}">You’ve signed out.</p>
    <form class="fields" th:action="@{/login}" method="post">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" required autofocus>
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button class="primary" type="submit">Sign in</button>
    </form>
</main>
</body>
</html>
