<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head(${title})}"></head>
<body>
<header th:replace="~{layout :: header}"></header>
<main class="container narrow">
    <a class="back" th:href="@{${base}}" th:text="|← ${title}|">Back</a>
    <h1 th:text="${users ? row.displayName() : row.name()}">Record</h1>
    <section class="panel">
        <dl>
            <th:block th:if="${users}">
                <dt>LDAP username</dt><dd th:text="${row.username()}"></dd>
                <dt>Role</dt><dd th:text="${row.role()}"></dd>
                <dt>Contact email</dt><dd th:text="${row.email()}"></dd>
            </th:block>
            <th:block th:unless="${users}">
                <dt>Price</dt><dd th:text="${row.price()}"></dd>
            </th:block>
        </dl>
        <div class="actions form-actions">
            <a class="button primary" th:href="@{${base + '/' + row.id() + '/edit'}}">Edit</a>
            <a class="button secondary text-danger" th:href="@{${base + '/' + row.id() + '/delete'}}">Delete</a>
        </div>
    </section>
</main>
</body>
</html>
