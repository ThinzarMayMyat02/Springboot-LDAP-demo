<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|${title} · Catalog|">Catalog</title>
    <link rel="stylesheet" th:href="@{/app.css}">
</head>
<body>
<header th:fragment="header" class="site-header">
    <div class="header-inner">
        <a class="brand" th:href="@{/products}">Catalog</a>
        <nav aria-label="Main navigation">
            <a th:href="@{/products}" th:attr="aria-current=${title == 'Products' ? 'page' : null}">Products</a>
            <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/users}"
               th:attr="aria-current=${title == 'Users' ? 'page' : null}">Users</a>
        </nav>
        <form class="session" th:action="@{/logout}" method="post">
            <span sec:authentication="name"></span>
            <button class="secondary" type="submit">Sign out</button>
        </form>
    </div>
</header>
</body>
</html>
