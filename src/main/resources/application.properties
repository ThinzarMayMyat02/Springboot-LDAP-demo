server.address=127.0.0.1
spring.datasource.url=jdbc:h2:mem:catalog
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.ldap.urls=${LDAP_URL:ldap://127.0.0.1:3890}
spring.ldap.base=${LDAP_BASE:dc=example,dc=test}
spring.ldap.username=uid=app-reader,ou=people,${spring.ldap.base}
spring.ldap.password=${LDAP_READER_PASSWORD:reader-local-password}
spring.ldap.base-environment[com.sun.jndi.ldap.connect.timeout]=3000
spring.ldap.base-environment[com.sun.jndi.ldap.read.timeout]=3000
catalog.directory.api-url=${LLDAP_API_URL:http://127.0.0.1:17170}
catalog.directory.admin-password=${LLDAP_ADMIN_PASSWORD:directory-local-password}
