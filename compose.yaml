services:
  ldap:
    image: ghcr.io/lldap/lldap:2026-09-22-debian
    ports:
      - "127.0.0.1:3890:3890"
      - "127.0.0.1:17170:17170"
    environment:
      LLDAP_LDAP_BASE_DN: dc=example,dc=test
      LLDAP_LDAP_USER_PASS: ${LLDAP_ADMIN_PASSWORD:-directory-local-password}
      LLDAP_JWT_SECRET: local-catalog-demo-jwt-secret
    volumes:
      - directory:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:17170/health"]
      interval: 5s
      timeout: 3s
      retries: 20
  ldap-bootstrap:
    image: ghcr.io/lldap/lldap:2026-09-22-debian
    depends_on:
      ldap:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/app/bootstrap.sh"]
    user: "0:0"
    environment:
      LLDAP_URL: http://ldap:17170
      LLDAP_ADMIN_PASSWORD: ${LLDAP_ADMIN_PASSWORD:-directory-local-password}
    volumes:
      - ./ldap/bootstrap:/bootstrap:ro
volumes:
  directory:
